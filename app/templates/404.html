{% extends "base.html" %}
{% block title %}Page not found — {{ profile.name }}{% endblock %}
{% block content %}
<section class="section error-page">
    <div class="container">
        <p class="error-code">404</p>
        <h1>This page doesn't exist</h1>
        <p>The link you followed may be broken, or the page may have moved.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to home</a>
    </div>
</section>
{% endblock %}
